version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gofmt
    - misspell
    - unconvert
    - gocritic

linters-settings:
  gocritic:
    disabled-checks:
      - commentedOutCode

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
